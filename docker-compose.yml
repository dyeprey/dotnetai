name: dotnetai

x-api-image: &api-image
  image: ${IMAGE:-ghcr.io/dyeprey/dotnetai-api}:${IMAGE_TAG:-latest}

  build:
    context: .
    dockerfile: Dockerfile

services:
  api-migrate:
    <<: *api-image
    container_name: dotnetai-api-migrate
    restart: "no"

    entrypoint: ["./efbundle"]
    command:
      - --connection
      - Data Source=/data/dotnetai.db
    volumes:
      - api-data:/data
    networks:
      - backend

  api:
    <<: *api-image
    container_name: dotnetai-api
    restart: unless-stopped
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__AppDb: "Data Source=/data/dotnetai.db"

      Jwt__Key: "${JWT_KEY:?JWT_KEY is not set - generate one with: openssl rand -base64 48}"
      Jwt__Issuer: ${JWT_ISSUER:-dotnetai.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-dotnetai.Client}

      OpenAI__ApiKey: "${OPENAI_API_KEY:?OPENAI_API_KEY is not set - get one from platform.openai.com}"
      OpenAI__Model: ${OPENAI_MODEL:-gpt-4o-mini}
      OpenAI__RequestsPerMinute: ${OPENAI_REQUESTS_PER_MINUTE:-20}

      Cors__AllowedOrigins__0: "${WEB_ORIGIN:?WEB_ORIGIN is not set - e.g. https://your-project.web.app}"
      Cors__AllowedOrigins__1: "${WEB_ORIGIN_ALT:-}"
      Cors__AllowedOrigins__2: "${WEB_ORIGIN_CUSTOM:-}"

    volumes:
      - api-data:/data
      - api-keys:/home/app/.aspnet

    expose:
      - "8080"

    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/auth/me | grep -q 401"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    mem_limit: 300m

    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: dotnetai-caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: "${API_DOMAIN:-:80}"
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - backend

volumes:
  api-data:
  api-keys:
  caddy-data:
  caddy-config:

networks:
  backend:
    driver: bridge
